# Tag-triggered release build for the Vicinity Graph plugin.
#
# WHAT fires it: pushing a tag whose name is the RAW plugin version (no `v`
# prefix) — exactly what `release_update_tag.sh` creates. Obsidian/BRAT match that
# raw string, so the tag name and `manifest.json` version must be identical.
#
# WHAT it does: fast, headless gates (`check` + `npm test`) → production build →
# a PUBLISHED GitHub Release for the pushed tag with the THREE raw assets Obsidian
# fetches directly (`manifest.json`, `main.js`, `styles.css`) — not just inside the
# source zip. See docs-internal/RELEASE_CHECKLIST.md §6.
#
# WHY-NOT the Playwright e2e matrix here: it needs a real Obsidian download + a
# display and is the LOCAL release gate (`release_update_tag.sh`, run before the
# tag is ever pushed). CI is the build/publish step, not the e2e authority.
#
# WHY published (not draft): the two-version e2e matrix + green gates already ran
# LOCALLY in `release_update_tag.sh` before the tag was ever pushed, and CI re-runs
# the fast gates here. The tag IS the human's deliberate publish decision, so a
# tag push cuts the release live — no second manual "Publish" click.
name: Release

on:
  push:
    tags:
      - "*"

# The release step needs write access to create the release for the tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The trigger is any tag ("*"), but this workflow only makes sense for a tag
      # whose name IS the raw manifest version (see the header comment). Enforce
      # that invariant up front so a stray or mismatched tag fails fast instead of
      # cutting a release whose asset `manifest.json` disagrees with its name
      # — a mismatch Obsidian/BRAT would then serve.
      - name: Verify tag matches manifest version
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          if [[ "${GITHUB_REF_NAME}" != "${manifest_version}" ]]; then
            echo "::error::pushed tag [${GITHUB_REF_NAME}] does not equal manifest.json version [${manifest_version}] — refusing to build a mismatched release."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches manifest.json version ${manifest_version}."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src + e2e)
        run: npm run check

      - name: Unit + integration tests
        run: npm test

      - name: Production build (main.js + styles.css)
        run: npm run build

      - name: Create published GitHub Release with raw assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            manifest.json
            main.js
            styles.css
